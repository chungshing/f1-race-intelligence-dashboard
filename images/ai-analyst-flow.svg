<text x="40" y="470" text-anchor="start" font-size="13" font-weight="400" fill="#475569">Steps 2 to 4 repeat until Gemini has what it needs, then it writes the answer (step 5).</text>
<text x="40" y="492" text-anchor="start" font-size="13" font-weight="400" fill="#475569">Gemini only asks for tools. The server runs them, so the API key and the data access never reach the browser.</text>
